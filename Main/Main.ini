[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=0
SkinWidth=#SCREENAREAWIDTH#
SkinHeight=#SCREENAREAHEIGHT#
OnRefreshAction=[!CommandMeasure Hub "Boot()"]
Group=GameHUBGlass
OnCloseAction=[!CommandMeasure Hub "MotionShutdown()"]
MouseScrollUpAction=[!CommandMeasure Hub "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure Hub "Scroll(1)"]
ContextTitle=Manage games
ContextAction=[!CommandMeasure Hub "Manager()"]
ContextTitle2=Reload library
ContextAction2=[!CommandMeasure Hub "ReloadAndOpen()"]
ContextTitle3=Close launcher
ContextAction3=[!CommandMeasure Hub "Close()"]
ContextTitle4=Settings file
ContextAction4=["#@#Settings.ini"]

[Metadata]
Name=GameHUB 3 (Liquid Glass)
Author=GameHUB Glass contributors; based on GameHUB 2 by FinchNelson / Ethan Grant
Version=1.1.2
Build=20260929.1
Information=Unofficial fullscreen game launcher. Click to launch; right-click to edit.
License=CC BY-NC-SA 3.0; see LICENSE.md

[Hub]
Measure=Script
ScriptFile=#@#Scripts\Hub.lua
UpdateDivider=-1

[SearchInput]
Measure=Plugin
Plugin=InputText
FontFace=Segoe UI
FontSize=11
FontColor=235,248,250,255
SolidColor=24,39,49,255
StringAlign=Left
FocusDismiss=1
InputLimit=128
DefaultValue=
Command1=
OnDismissAction=
UpdateDivider=-1

[Animator]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Frame, 16, 100000
Frame=[!CommandMeasure Hub "Tick()"]
UpdateDivider=-1

[HoverTimer]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 55 | Commit
Commit=[!CommandMeasure Hub "CommitHover()"]
UpdateDivider=-1

[HoverLeaveTimer]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 80 | Commit
Commit=[!CommandMeasure Hub "CommitHoverLeave()"]
UpdateDivider=-1

[ManagerRunner]
Measure=Plugin
Plugin=RunCommand
Program=%WINDIR%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-ExecutionPolicy Bypass -NoLogo -NoProfile -NonInteractive -STA -WindowStyle Hidden -File "#@#Scripts\Manager.ps1" -Resources "#@#."
State=Show
OutputType=UTF8
OutputFile=#@#Manager.log
FinishAction=[!CommandMeasure Hub "ManagerFinished()"]
DynamicVariables=1
UpdateDivider=-1

[MotionRunner]
Measure=Plugin
Plugin=RunCommand
Program=%WINDIR%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-ExecutionPolicy Bypass -NoLogo -NoProfile -NonInteractive -STA -WindowStyle Hidden -File "#@#Scripts\MotionHost.ps1" -Resources "#@#." -RainmeterExe "#PROGRAMPATH#Rainmeter.exe" -SkinIni "#CURRENTPATH#Main.ini" -Config "#CURRENTCONFIG#"
State=Hide
OutputType=UTF8
OutputFile=#@#Motion.log
FinishAction=[!CommandMeasure Hub "MotionFinished()"]
UpdateDivider=-1

[MotionDelay]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 900 | Commit
Commit=[!CommandMeasure Hub "MotionCommit()"]
DynamicVariables=1
UpdateDivider=-1

[ToastTimer]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 2600 | Dismiss
Dismiss=[!CommandMeasure Hub "HideToast()"]
UpdateDivider=-1

[ManagerWatch]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Check, 250, 120
Check=[!CommandMeasure Hub "ManagerCheck()"]
UpdateDivider=-1

