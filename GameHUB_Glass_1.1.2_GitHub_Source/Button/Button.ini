[Rainmeter]
Update=-1
AccurateText=1
OnRefreshAction=[!CommandMeasure ButtonScript "Place()"]
ContextTitle=Open launcher
ContextAction=[!CommandMeasure ButtonScript "Open()"]
ContextTitle2=Unload launcher and button
ContextAction2=[!DeactivateConfig "#ROOTCONFIG#\Main"][!DeactivateConfig]

[Metadata]
Name=GameHUB 3 (Liquid Glass) button
Author=GameHUB Glass contributors; controller artwork adapted from GameHUB 2
Version=1.1.2
Build=20260929.1
License=CC BY-NC-SA 3.0; see LICENSE.md

[Variables]
S=(Min(#SCREENAREAWIDTH#/2560,#SCREENAREAHEIGHT#/1440))

[ButtonScript]
Measure=Script
ScriptFile=#@#Scripts\Button.lua
UpdateDivider=-1

[ButtonFeedback]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Wait 100 | Release
Release=[!CommandMeasure ButtonScript "ReleasePress()"]
UpdateDivider=-1

[ButtonBody]
Meter=Shape
X=(5*#S#)
Y=(5*#S#)
Shape=Rectangle 0,0,(74*#S#),(74*#S#),(25*#S#) | Fill Color 17,35,45,215 | StrokeWidth (1*#S#) | Stroke Color 212,247,241,110
Shape2=Line (21*#S#),(1*#S#),(53*#S#),(1*#S#) | StrokeWidth (1*#S#) | Stroke Color 244,255,255,150
UpdateDivider=-1

[Controller]
Meter=Image
X=(19*#S#)
Y=(19*#S#)
W=(46*#S#)
H=(46*#S#)
ImageName=#@#UI\Controller.png
ImageTint=222,249,244,255
UpdateDivider=-1

[ButtonHit]
Meter=Image
X=0
Y=0
W=(84*#S#)
H=(84*#S#)
SolidColor=0,0,0,1
MouseActionCursor=1
ToolTipText=Open GameHUB 3 (Liquid Glass)
LeftMouseUpAction=[!CommandMeasure ButtonScript "Click()"]
MouseOverAction=[!CommandMeasure ButtonScript "Control('over')"]
MouseLeaveAction=[!CommandMeasure ButtonScript "Control('leave')"]
UpdateDivider=-1

